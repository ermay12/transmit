# On every push to main: runs the unit tests and builds a signed release APK. When versionName is new
# (no tag v<versionName> yet), publishes the APK as a GitHub release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Releases go out one at a time, in push order.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The version code is the number of commits, which needs the whole history.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Release builds are signed with the debug key. Using the same key as local builds lets
      # these APKs install over them, and the reverse. app/build.gradle.kts reads TRANSMIT_KEYSTORE.
      - name: Install signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Missing the DEBUG_KEYSTORE_BASE64 secret (base64 of ~/.android/debug.keystore)."
            exit 1
          fi
          keystore="$RUNNER_TEMP/debug.keystore"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          fingerprint=$(keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Signing key SHA-256: $fingerprint"
          echo "TRANSMIT_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "KEY_SHA256=$fingerprint" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      # An APK signed with any other key won't install over the app on the phone.
      - name: Check signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          certs=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$certs"
          # The label differs by apksigner version: "Signer #1 certificate …", "V2 Signer: certificate …".
          signers=$(echo "$certs" | grep -iv 'stamp' | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u)
          if [ -z "$KEY_SHA256" ] || [ "$signers" != "$KEY_SHA256" ]; then
            echo "::error::The APK is signed with '${signers//$'\n'/, }', not the shared key $KEY_SHA256."
            exit 1
          fi
          echo "Signed with the shared key."

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=app/build/outputs/apk/release
          name=$(jq -r '.elements[0].versionName' "$out/output-metadata.json")
          tag="v$name"
          # One release per version: pushes that don't change versionName only build and test.
          if gh release view "$tag" > /dev/null 2>&1 || git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "Release $tag already exists. Bump versionName to publish a new one."
            exit 0
          fi
          apk="transmit-$name.apk"
          cp "$out/app-release.apk" "$apk"

          # Notes: the commits since the previous release, then how this APK differs from Google Play's.
          prev=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // empty')
          {
            echo "## Changes"
            echo
            if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" > /dev/null; then
              git log --no-merges --format='- %s' "$prev..HEAD"
            else
              git log --no-merges --format='- %s' -n 20
            fi
            echo
            cat .github/release-footer.md
          } > notes.md

          gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Transmit $name" --notes-file notes.md --latest
