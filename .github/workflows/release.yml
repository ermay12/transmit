# Builds a signed release APK on every push to main and publishes it as a GitHub release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Releases go out one at a time, in push order.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The version code is the number of commits, which needs the whole history.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Release builds are signed with the debug key. Using the same key as local builds lets
      # these APKs install over them, and the reverse. app/build.gradle.kts reads TRANSMIT_KEYSTORE.
      - name: Install signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Missing the DEBUG_KEYSTORE_BASE64 secret (base64 of ~/.android/debug.keystore)."
            exit 1
          fi
          keystore="$RUNNER_TEMP/debug.keystore"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          fingerprint=$(keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Signing key SHA-256: $fingerprint"
          echo "TRANSMIT_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "KEY_SHA256=$fingerprint" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      # An APK signed with any other key won't install over the app on the phone.
      - name: Check signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          certs=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$certs"
          # Signer lines read "Signer #1 …" or "Signer (minSdkVersion=…) …", depending on the apksigner version.
          signers=$(echo "$certs" | sed -n 's/^Signer.* certificate SHA-256 digest: //p' | sort -u)
          if [ -z "$KEY_SHA256" ] || [ "$signers" != "$KEY_SHA256" ]; then
            echo "::error::The APK is signed with '${signers//$'\n'/, }', not the shared key $KEY_SHA256."
            exit 1
          fi
          echo "Signed with the shared key."

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=app/build/outputs/apk/release
          code=$(jq -r '.elements[0].versionCode' "$out/output-metadata.json")
          name=$(jq -r '.elements[0].versionName' "$out/output-metadata.json")
          tag="v$name-$code"
          apk="transmit-$name-$code.apk"
          cp "$out/app-release.apk" "$apk"

          # Notes: the commits since the previous release.
          prev=$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // empty')
          if [ -n "$prev" ] && [ "$prev" != "$tag" ] && git rev-parse -q --verify "refs/tags/$prev" > /dev/null; then
            git log --format='- %s' "$prev..HEAD" > notes.md
          else
            git log --format='- %s' -n 20 > notes.md
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Transmit $name ($code)" --notes-file notes.md
          fi
